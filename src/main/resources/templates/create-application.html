<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Submit Unemployed Application</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f7f6; }
        .form-container { background: white; padding: 30px; border-radius: 8px; max-width: 500px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { height: 100px; resize: vertical; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #004085; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 4px; font-weight: bold; text-align: center; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Unemployment Allowance Application</h2>

    <!-- Notifications -->
    <div th:if="${successMessage}" class="message success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="message error" th:text="${errorMessage}"></div>

    <form th:action="@{/ui/applications/submit}" th:object="${applicationData}" method="POST">
        <div class="form-group">
            <label>Select Registered Worker:</label>
            <!-- Replaced input with a drop-down select element -->
            <select th:field="*{workerId}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="" disabled selected>-- Choose a Worker --</option>
                <!-- Loops through workersList, displays name + NID, but submits the numeric ID -->
                <option th:each="w : ${workersList}"
                        th:value="${w.workerID}"
                        th:text="${w.workerName + ' (NID: ' + w.nationalIdNumber + ')'}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Reason for Unemployment:</label>
            <textarea th:field="*{reasonForUnemployment}" placeholder="Describe why you are applying for the allowance program..." required></textarea>
        </div>

        <button type="submit">Submit Application</button>
    </form>
</div>

</body>
</html>
